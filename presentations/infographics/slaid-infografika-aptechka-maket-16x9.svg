    <path d="M85 105 H135" stroke="#CC0000" stroke-width="6" stroke-linecap="round"/>
    <rect x="95" y="80" width="30" height="50" rx="8" fill="#CC0000" opacity="0.14" stroke="#CC0000" stroke-width="4"/>
    <text x="110" y="145" text-anchor="middle" class="tokenLabel">#"</text>
  </g>

  <g class="token" transform="translate(1420,740)">
    <rect width="220" height="150" rx="24" fill="white" stroke="#D0D0D0" stroke-width="3"/>
    <!-- Isothermal blanket (foil) -->
    <path d="M65 95
             L110 65
             L155 95
             L155 135
             L65 135 Z"
          fill="#BDBDBD" opacity="0.18" stroke="#BDBDBD" stroke-width="4"/>
    <path d="M95 75 L125 105" stroke="#8D8D8D" stroke-width="4" stroke-linecap="round"/>
    <path d="M80 105 L145 120" stroke="#8D8D8D" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 90 C95 120, 125 70, 150 100" stroke="#BDBDBD" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="110" y="145" text-anchor="middle" class="tokenLabel">" '!</text>
  </g>

  <g class="token" transform="translate(1420,910)">
    <rect width="220" height="150" rx="24" fill="white" stroke="#D0D0D0" stroke-width="3"/>
    <!-- CPR airway device -->
    <rect x="70" y="55" width="80" height="90" rx="20" fill="#1565C0" opacity="0.14" stroke="#1565C0" stroke-width="4"/>
    <path d="M100 85 C110 75, 120 85, 120 95" stroke="#1565C0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="110" cy="110" r="10" fill="#1565C0" opacity="0.22" stroke="#1565C0" stroke-width="4"/>
    <text x="110" y="145" text-anchor="middle" class="tokenLabel">#!" !"</text>
  </g>

  <!-- Mask token (middle-right below) -->
  <g class="token" transform="translate(1100,570)">
    <rect width="220" height="150" rx="24" fill="white" stroke="#D0D0D0" stroke-width="3"/>
    <!-- Medical mask -->
    <path d="M70 80
             C70 65, 85 55, 110 55
             C135 55, 150 65, 150 80
             L150 115
             C150 130, 135 140, 110 140
             C85 140, 70 130, 70 115 Z"
          fill="#37474F" opacity="0.14" stroke="#37474F" stroke-width="4"/>
    <path d="M88 85 H132" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
    <path d="M92 110 H128" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
    <text x="110" y="145" text-anchor="middle" class="tokenLabel">!</text>
  </g>
</svg>

